
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: /home/runner/.gradle

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Verificar versiones
        run: |
          node --version
          npm --version
          java -version

      - name: Limpiar caché de Gradle
        run: |
          rm -rf "$GRADLE_USER_HOME/caches"
          rm -rf "$GRADLE_USER_HOME/daemon"
          mkdir -p "$GRADLE_USER_HOME"

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Compilar aplicación web
        run: npm run build

      - name: Inicializar Android si es necesario
        run: |
          if [ ! -d "android" ]; then
            npx cap init IMSS com.example.imss --web-dir dist
            npx cap add android
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --max-workers=1

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: IMSS-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
