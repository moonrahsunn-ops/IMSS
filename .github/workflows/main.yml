name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Configurar Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Limpiar caché corrupto de Gradle (ANTES de Capacitor)
      run: |
        rm -rf /home/runner/.gradle/caches || true
        rm -rf /home/runner/.gradle/jc || true
        rm -rf "${{ runner.temp }}/gradle" || true
        mkdir -p "${{ runner.temp }}/gradle"

    - name: Instalar dependencias y compilar web
      run: |
        npm install
        npm run build

    - name: Verificar o inicializar Capacitor
      run: |
        if [ ! -d "android" ]; then
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init IMSS com.example.imss --web-dir dist
          npx cap add android
        fi
        npx cap sync android || (sleep 3 && npx cap sync android)

    - name: Dar permisos a Gradle
      run: chmod +x android/gradlew

    - name: Compilar APK con Gradle
      run: |
        cd android
        ./gradlew assembleDebug --refresh-dependencies --no-daemon

    - name: Subir APK listo para descargar
      uses: actions/upload-artifact@v4
      with:
        name: IMSS-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
